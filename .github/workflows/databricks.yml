
# This creates a FIXED workflow file with correct YAML syntax

fixed_workflow = '''name: Run Databricks Notebook

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-databricks-notebook:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install Databricks SDK
      run: |
        pip install databricks-sdk
    
    - name: Run Databricks Notebook
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        python << "PYTHON_SCRIPT"
import os
import time
import sys
from databricks.sdk import WorkspaceClient

# Initialize client
w = WorkspaceClient(
    host=os.environ["DATABRICKS_HOST"],
    token=os.environ["DATABRICKS_TOKEN"]
)

print("Connected to Databricks")

# Create and run job
try:
    # Create job
    job = w.jobs.create(
        name=f"GitHub_Actions_Run_${{ github.run_number }}",
        tasks=[
            {
                "task_key": "run_notebook",
                "notebook_task": {
                    "notebook_path": "/Users/punithm58@gmail.com/Data Pipeline Testing Framework",
                    "source": "WORKSPACE"
                },
                "new_cluster": {
                    "spark_version": "14.3.x-scala2.12",
                    "node_type_id": "i3.xlarge",
                    "num_workers": 1
                }
            }
        ],
        max_concurrent_runs=1
    )
    
    print(f"Created job: {job.job_id}")
    
    # Run job
    run = w.jobs.run_now(job_id=job.job_id)
    print(f"Started run: {run.run_id}")
    
    # Wait for completion
    while True:
        run_status = w.jobs.get_run(run_id=run.run_id)
        state = run_status.state.life_cycle_state.value
        print(f"Current state: {state}")
        
        if state in ["TERMINATED", "SKIPPED", "INTERNAL_ERROR"]:
            break
        
        time.sleep(10)
    
    # Check result
    result = run_status.state.result_state.value
    print(f"Final result: {result}")
    
    # Cleanup
    w.jobs.delete(job_id=job.job_id)
    print("Cleaned up temporary job")
    
    # Exit with appropriate code
    if result == "SUCCESS":
        print("Notebook executed successfully!")
        sys.exit(0)
    else:
        print(f"Notebook execution failed: {result}")
        sys.exit(1)
        
except Exception as e:
    print(f"Error: {str(e)}")
    sys.exit(1)
PYTHON_SCRIPT
    
    - name: Summary
      if: always()
      run: |
        echo "Check Databricks workspace for detailed logs"
        echo "Notebook: /Users/punithm58@gmail.com/Data Pipeline Testing Framework"
'''

print("=" * 80)
print("FIXED GITHUB ACTIONS WORKFLOW")
